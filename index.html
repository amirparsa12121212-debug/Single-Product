<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فروشگاه خانه | فروش لوازم خانگی</title>
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #e2e8f0;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tahoma', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; font-family: inherit; }
    img { max-width: 100%; display: block; }

    .header {
      background: var(--card);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 10px 16px;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 1.25rem;
      color: var(--primary);
      white-space: nowrap;
    }
    .logo img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }
    .search-box {
      flex: 1;
      min-width: 180px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-box::before {
      content: "🔍";
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-btn {
      background: transparent;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
      position: relative;
    }
    .nav-btn:hover { background: #f1f5f9; }
    .nav-btn.admin-btn {
      background: #fef3c7;
      color: #b45309;
      font-size: 12px;
      padding: 6px 10px;
    }
    .badge {
      position: absolute;
      top: -4px;
      left: -4px;
      background: var(--danger);
      color: white;
      font-size: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .section-title {
      font-size: 1.3rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 900px) {
      .products-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
    .product-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }
    .product-img-wrap {
      position: relative;
      aspect-ratio: 1;
      background: #f1f5f9;
      overflow: hidden;
    }
    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product-status {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--success);
      color: white;
    }
    .product-status.out {
      background: var(--danger);
    }
    .product-body {
      padding: 10px 12px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .product-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      height: 2.6em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .product-price {
      color: var(--primary);
      font-weight: bold;
      font-size: 15px;
    }
    .product-actions {
      display: flex;
      gap: 6px;
      margin-top: auto;
    }
    .btn {
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
      flex: 1;
      text-align: center;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { background: #f1f5f9; }
    .btn-fav {
      flex: 0 0 36px;
      padding: 7px;
      background: #fef2f2;
      color: #ef4444;
      border-radius: 8px;
    }
    .btn-fav.active { background: #ef4444; color: white; }

    .view-all-wrap {
      text-align: center;
      margin-top: 24px;
    }
    .view-all-btn {
      background: var(--primary);
      color: white;
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
    }
    .view-all-btn:hover { background: var(--primary-dark); }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }
    .overlay.show { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 16px;
      width: 100%;
      max-width: 900px;
      margin: 20px auto;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--card);
      z-index: 10;
    }
    .modal-header h2 { font-size: 1.2rem; }
    .close-btn {
      background: #f1f5f9;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-body { padding: 20px; }

    .admin-form {
      display: grid;
      gap: 14px;
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: var(--muted);
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
    .ai-btn {
      background: #8b5cf6;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 6px;
    }
    .ai-btn:hover { background: #7c3aed; }
    .admin-products { display: grid; gap: 12px; }
    .admin-item {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #f8fafc;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .admin-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }
    .admin-item-info { flex: 1; }
    .admin-item-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }
    .btn-danger { background: var(--danger); color: white; }
    .btn-warning { background: #f59e0b; color: white; }
    .btn-success { background: var(--success); color: white; }

    .cart-item, .fav-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .cart-item img, .fav-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }
    .cart-item-info { flex: 1; }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #f1f5f9;
      font-size: 16px;
    }
    .cart-total {
      padding: 16px;
      background: #f0fdfa;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
    }
    .empty-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .delivery-options {
      display: grid;
      gap: 10px;
      margin: 16px 0;
    }
    .delivery-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: border 0.2s;
    }
    .delivery-option:hover, .delivery-option.selected {
      border-color: var(--primary);
      background: #f0fdfa;
    }
    .delivery-option input { accent-color: var(--primary); }

    .contact-info {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .contact-info h2 { margin-bottom: 16px; color: var(--primary); }
    .contact-info p { margin: 8px 0; font-size: 1.05rem; }
    .map-wrap {
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
      height: 300px;
    }
    .map-wrap iframe { width: 100%; height: 100%; border: 0; }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 40px;
    }

    .login-box {
      max-width: 360px;
      margin: 40px auto;
      background: var(--card);
      padding: 28px;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .login-box h2 { text-align: center; margin-bottom: 20px; }
    .login-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 16px;
      text-align: center;
      letter-spacing: 4px;
    }

    .hidden { display: none !important; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="#" class="logo" onclick="showPage('home')">
        <img src="logo.png" alt="لوگوی فروشگاه خانه" />
      </a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="جستجوی کالا..." oninput="filterProducts()" />
      </div>
      <div class="nav-actions">
        <button class="nav-btn admin-btn" onclick="openAdmin()">⚙️ مدیریت</button>
        <button class="nav-btn" onclick="showPage('favorites')">
          ❤️ علاقه‌مندی
          <span class="badge" id="favBadge" style="display:none">0</span>
        </button>
        <button class="nav-btn" onclick="showPage('cart')">
          🛒 سبد خرید
          <span class="badge" id="cartBadge" style="display:none">0</span>
        </button>
        <button class="nav-btn" onclick="showPage('contact')">📞 تماس با ما</button>
      </div>
    </div>
  </header>

  <!-- Home Page -->
  <main class="container" id="page-home">
    <div class="section-title">
      <span>محصولات ویژه</span>
    </div>
    <div class="products-grid" id="productsGrid"></div>
    <div class="view-all-wrap">
      <button class="view-all-btn" onclick="openAllProducts()">مشاهده همه محصولات</button>
    </div>
  </main>

  <!-- Cart Page -->
  <main class="container hidden" id="page-cart">
    <div class="section-title"><span>سبد خرید</span></div>
    <div id="cartList"></div>
    <div class="cart-total" id="cartTotal"></div>
    <div style="text-align:center; margin-top:20px;">
      <button class="btn btn-primary" style="padding:12px 40px; font-size:15px;" onclick="goToOrder()">ثبت سفارش</button>
    </div>
  </main>

  <!-- Favorites Page -->
  <main class="container hidden" id="page-favorites">
    <div class="section-title"><span>علاقه‌مندی‌ها</span></div>
    <div class="products-grid" id="favGrid"></div>
  </main>

  <!-- Contact Page -->
  <main class="container hidden" id="page-contact">
    <div class="contact-info">
      <h2>📞 تماس با ما</h2>
      <p><strong>شماره تلفن:</strong> <a href="tel:+989134520257">+98 913 452 0257</a></p>
      <p><strong>آدرس:</strong> یزد (مختصات: ۳۱.۸۱۶۰۷۸۷ ، ۵۴.۳۹۲۶۵۵۴)</p>
      <div class="map-wrap">
        <iframe
          src="https://maps.google.com/maps?q=31.8160787,54.3926554&z=15&output=embed"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
    </div>
  </main>

  <!-- Order / Payment Page -->
  <main class="container hidden" id="page-order">
    <div class="section-title"><span>ثبت سفارش و پرداخت</span></div>
    <div class="admin-form" style="max-width:500px; margin:0 auto;">
      <div class="form-group">
        <label>شماره تلفن</label>
        <input type="tel" id="orderPhone" placeholder="09123456789" />
      </div>
      <div class="form-group">
        <label>آدرس کامل</label>
        <textarea id="orderAddress" rows="3" placeholder="آدرس دقیق تحویل..."></textarea>
      </div>
      <h3 style="margin:16px 0 8px;">زمان تحویل</h3>
      <div class="delivery-options" id="deliveryOptions"></div>
      <div class="form-group">
        <label>هزینه ارسال (تومان)</label>
        <input type="number" id="shippingPrice" value="50000" readonly />
      </div>
      <div class="cart-total" id="orderTotal"></div>
      <button class="btn btn-primary" style="width:100%; padding:14px; font-size:16px; margin-top:12px;" onclick="submitOrder()">
        پرداخت و ثبت نهایی سفارش
      </button>
    </div>
  </main>

  <!-- All Products Modal -->
  <div class="overlay" id="allProductsOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>همه محصولات</h2>
        <button class="close-btn" onclick="closeAllProducts()">×</button>
      </div>
      <div class="modal-body">
        <div class="search-box" style="margin-bottom:16px;">
          <input type="text" id="searchAllInput" placeholder="جستجو در همه کالاها..." oninput="filterAllProducts()" />
        </div>
        <div class="products-grid" id="allProductsGrid"></div>
      </div>
    </div>
  </div>

  <!-- Admin Overlay -->
  <div class="overlay" id="adminOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>پنل مدیریت</h2>
        <button class="close-btn" onclick="closeAdmin()">×</button>
      </div>
      <div class="modal-body" id="adminContent">
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>
    فروشگاه خانه © ۱۴۰۴ — همه حقوق محفوظ است
          </footer>
